<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Jetstep Jam! — guide Pip through a thousand musical machines in this portrait-first jet-boot arcade adventure."
    />
    <meta name="theme-color" content="#160f2d" />
    <meta property="og:title" content="Jetstep Jam!" />
    <meta property="og:description" content="Light the boots. Recover the Sound Sparks. Restore the Harmony Engine." />
    <meta property="og:type" content="website" />
    <title>Jetstep Jam! — Little Joy Arcade</title>
    <style>
      :root {
        color-scheme: dark;
        --frame: #160f2d;
        --glow: #5cf2d6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 0%, rgba(92, 242, 214, 0.12), transparent 38%),
          radial-gradient(circle at 15% 80%, rgba(255, 126, 196, 0.12), transparent 36%),
          #090712;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #game canvas {
        display: block;
        touch-action: none;
        box-shadow: 0 0 90px rgba(92, 242, 214, 0.1);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      #boot-fail {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
        background: #120d24;
        color: #fff4dc;
      }
      #boot-fail.visible {
        display: grid;
      }
      #boot-fail strong {
        display: block;
        font-size: 26px;
        margin-bottom: 10px;
        color: #5cf2d6;
      }
      #boot-fail p {
        max-width: 340px;
        line-height: 1.6;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Jetstep Jam game canvas" role="application"></main>
    <p id="game-status" class="sr-only" aria-live="polite"></p>
    <div id="boot-fail" role="alert">
      <div>
        <strong>Pip could not light the boots.</strong>
        <p>This browser needs WebGL or Canvas, JavaScript, and a little patience. Reload to try again.</p>
      </div>
    </div>
    <noscript>Jetstep Jam! needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
    <script src="./arcade-client.js" data-game-id="jetstep-jam"></script>
  </body>
</html>
